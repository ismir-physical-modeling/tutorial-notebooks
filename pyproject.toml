[project]
name = "tutorial-notebooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.30.1",
    "jaxdiffmodal",
    "ruff>=0.9.2",
    "jax>=0.7.0; sys_platform != 'linux'",
    "jax[cuda12]>=0.7.0; sys_platform == 'linux'",
    "tqdm>=4.67.1",
    "optax>=0.2.5",
    "equinox>=0.13.0",
    "numpy>=2.1.0",
    "matplotlib>=3.10.5",
    "scienceplots>=2.1.1",
    "ffmpeg-python>=0.2.0",
    "jax-dataloader>=0.1.3",
    "gdown>=5.2.0",
    "soundfile>=0.13.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
output-format = "concise"

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722", "UP038"]
ignore-init-module-imports = true
select = ["E", "F", "I001", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
lines-after-imports = 2
order-by-type = false

# there are no pacakes here but this is needed for pip
[tool.setuptools]
packages = ["part2", "part3", "part4"]

[tool.ty.environment]
extra-paths = ["./part3"]
